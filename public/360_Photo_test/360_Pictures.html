<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度全景圖</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
    #panorama {
        width: 680px;
        height: 500px;
    }
    </style>
</head>
<body>

<div id="panorama"></div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var currentUrl = window.location.href; // 獲取當前頁面的完整 URL
    var baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')); // 從 URL 中提取基礎路徑（不包含文件名）
    var panoramaUrl = baseUrl + "/20240521_143257_386.jpg"; // 將圖像文件名添加到基礎路徑上

    pannellum.viewer('panorama', {
        "type": "equirectangular", // 設置全景圖的類型
        "panorama": panoramaUrl, // 使用動態生成的 URL 加載全景圖像
        "autoLoad": true // 自動加載全景圖
    });
});
</script>

</body>
</html>
